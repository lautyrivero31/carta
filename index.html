<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffe6e8;
      color: #444;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
      text-align: center;
    }

    .envelope-wrapper {
      position: relative;
      width: 280px;
      height: 180px;
      margin: 0 auto 20px;
      cursor: pointer;
      background: #f08080;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 20px rgb(0 0 0 / 15%);
    }

    .envelope-wrapper::before {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      width: 0;
      height: 0;
      content: "";
      border-top: 100px solid #e06666;
      border-right: 140px solid transparent;
      border-left: 140px solid transparent;
      transform-origin: top;
      transition: transform 0.6s ease-in-out;
    }

    .envelope-wrapper::after {
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 2;
      width: 0;
      height: 0;
      content: "";
      border-right: 140px solid #f49797;
      border-bottom: 90px solid #f49797;
      border-left: 140px solid #f49797;
      border-top: 90px solid transparent;
      border-radius: 0 0 10px 10px;
    }

    .heart-seal {
      position: absolute;
      top: 80px;
      left: 50%;
      z-index: 4;
      font-size: 30px;
      transform: translate(-50%, -50%);
      transition: opacity 0.4s;
    }

    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      z-index: 1;
      display: flex;
      width: 250px;
      height: 150px;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgb(0 0 0 / 10%);
      transition: transform 0.6s ease-in-out, height 0.6s ease-in-out;
    }

    .envelope-wrapper.open::before {
      z-index: 0;
      transform: rotateX(180deg);
    }

    .envelope-wrapper.open .letter {
      z-index: 5;
      height: 280px;
      transform: translateY(-130px);
    }

    .envelope-wrapper.open .heart-seal {
      opacity: 0;
    }

    .tap-hint {
      margin-top: 10px;
      color: #d63384;
      font-size: 16px;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    .card-title {
      margin-bottom: 10px;
      color: #ff4b6e;
      font-size: 18px;
    }

    .card-text {
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.4;
    }

    .btn-group {
      position: relative;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 10px 20px;
      border: 0;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-yes {
      background: #28a745;
    }

    .btn-no {
      position: relative;
      background: #dc3545;
    }

    .hidden {
      display: none !important;
    }

    .heart-particle {
      position: fixed;
      color: #ff4b6e;
      font-size: 20px;
      pointer-events: none;
      animation: float-up 3s linear forwards;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translateY(100vh) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translateY(-10vh) scale(1.2);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="envelope-wrapper" id="envelope" role="button" tabindex="0"
      aria-label="Abrir sobre" aria-expanded="false">
      <div class="heart-seal" aria-hidden="true">❤️</div>
      <div class="letter">
        <div id="content-question">
          <h1 class="card-title">Tengo una pregunta... 🌹</h1>
          <p class="card-text">¿Querés unas partiditas?</p>
          <div class="btn-group">
            <button class="btn-yes" id="btnYes" type="button">¡SÍ! ❤️</button>
            <button class="btn-no" id="btnNo" type="button">No 😜</button>
          </div>
        </div>
        <div id="content-success" class="hidden">
          <h1 class="card-title">¡Yo sabía, a romper culos en ese juego! 🥰</h1>
          <p class="card-text">
            Gracias por ser mi compañera en todo, te amo mi vida.
            <br><br>
            ¡Después una charlita hot! ✨
          </p>
        </div>
      </div>
    </div>
    <p class="tap-hint" id="tapHint">✨ Toca el sobre para abrirlo ✨</p>
  </main>

  <script>
    const envelope = document.getElementById("envelope");
    const tapHint = document.getElementById("tapHint");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");
    const contentQuestion = document.getElementById("content-question");
    const contentSuccess = document.getElementById("content-success");
    let isOpened = false;
    let noClickCount = 0;

    function openEnvelope() {
      if (isOpened) return;
      envelope.classList.add("open");
      envelope.setAttribute("aria-expanded", "true");
      tapHint.classList.add("hidden");
      isOpened = true;
    }

    function dodgeNoButton(event) {
      event.stopPropagation();
      noClickCount += 1;

      btnYes.style.fontSize = `${15 + noClickCount * 6}px`;
      btnYes.style.padding = `${10 + noClickCount * 3}px ${20 + noClickCount * 5}px`;
      btnNo.style.transform = `scale(${Math.max(0.3, 1 - noClickCount * 0.15)})`;

      const phrases = ["¿Segura? 🥺", "Piénsalo bien... 💔", "¡Oye! 🙈", "No acepto un No 😜", "¡Toca el SÍ! ❤️"];
      btnNo.textContent = phrases[Math.min(noClickCount - 1, phrases.length - 1)];
    }

    function acceptProposal(event) {
      event.stopPropagation();
      contentQuestion.classList.add("hidden");
      contentSuccess.classList.remove("hidden");
      createHearts();
    }

    function createHearts() {
      const hearts = ["❤️", "💖", "💗", "💕", "🌹"];
      for (let index = 0; index < 40; index += 1) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.className = "heart-particle";
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.left = `${Math.random() * 100}vw`;
          heart.style.animationDuration = `${Math.random() * 2 + 2}s`;
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 4000);
        }, index * 80);
      }
    }

    envelope.addEventListener("click", openEnvelope);
    envelope.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openEnvelope();
      }
    });
    btnNo.addEventListener("click", dodgeNoButton);
    btnYes.addEventListener("click", acceptProposal);
  </script>
</body>
</html>
